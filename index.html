<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><title>Крутится — колесо фортуны</title>
<style>:root{color-scheme:light;--glow-one:#bc9aff70;--glow-two:#e3a8ff50;--bg:#eee9f8;--surface:#fffaffdc;--surface-2:#f7f1ffcf;--ink:#2c2040;--muted:#827590;--line:#e6dcf2;--accent:#8753e8;--accent-ink:#fff;--shadow:0 28px 90px #4d30701c;--hub:#7944c7}
:root[data-theme="dark"]{color-scheme:dark;--glow-one:#8e43ff78;--glow-two:#ca4cff42;--bg:#000;--surface:#100b18df;--surface-2:#171020d4;--ink:#f7f0ff;--muted:#a99bb9;--line:#30213f;--accent:#bc83ff;--accent-ink:#1a1025;--shadow:0 28px 100px #5e27a42c;--hub:#e8d6ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px;background:radial-gradient(ellipse at 8% 10%,var(--glow-one),transparent 34%),radial-gradient(ellipse at 92% 88%,var(--glow-two),transparent 38%),linear-gradient(145deg,var(--bg),var(--surface-2));background-attachment:fixed;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;transition:background .35s,color .35s}.app{width:min(1240px,100%);min-height:min(820px,calc(100vh - 56px));margin:auto;background:linear-gradient(145deg,var(--surface),color-mix(in srgb,var(--surface) 88%,var(--accent) 12%));border:1px solid color-mix(in srgb,var(--line) 72%,var(--accent) 28%);border-radius:32px;box-shadow:var(--shadow),0 0 55px color-mix(in srgb,var(--accent) 10%,transparent);display:grid;grid-template-columns:1fr 390px;grid-template-rows:auto 1fr auto;overflow:hidden;backdrop-filter:blur(24px) saturate(140%);transition:background .3s,border-color .3s,box-shadow .3s}
header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:21px 30px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--surface) 80%,transparent);backdrop-filter:blur(16px)}.brand{display:flex;align-items:center;gap:11px;font-weight:850;letter-spacing:-.04em;font-size:18px}.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(145deg,#bd8aff,#7d4bd9);color:white;display:grid;place-items:center;font-size:21px;box-shadow:0 5px 18px #8e54df50}.top-right{display:flex;gap:18px;align-items:center}.mode-label{color:var(--muted);font-size:12px;font-weight:650}.theme-toggle{display:flex;align-items:center;gap:9px;padding:7px 11px 7px 8px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--ink);cursor:pointer;font:inherit;font-size:12px;font-weight:700;box-shadow:0 3px 12px #5d34740b}.toggle-track{width:34px;height:20px;border-radius:99px;background:var(--surface-2);position:relative}.toggle-track:after{content:"";position:absolute;width:14px;height:14px;left:3px;top:3px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px color-mix(in srgb,var(--accent) 50%,transparent);transition:transform .2s}.dark .toggle-track:after{transform:translateX(14px)}
.stage{padding:38px 36px 26px;display:flex;flex-direction:column;min-width:0;position:relative}.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.2em;color:var(--accent);font-weight:850;margin:0 0 12px}h1{font-size:clamp(36px,4.5vw,62px);letter-spacing:-.07em;line-height:.96;margin:0;text-wrap:balance}.lede{color:var(--muted);font-size:15px;margin:16px 0 0}.wheel-zone{position:relative;flex:1;min-height:360px;display:grid;place-items:center;padding:24px 10px 4px}.wheel-zone:before{content:"";position:absolute;width:min(78%,500px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 20%,transparent),transparent 69%);filter:blur(18px);pointer-events:none}.wheel-wrap{width:min(100%,490px);aspect-ratio:1;position:relative;filter:drop-shadow(0 16px 23px #0002) drop-shadow(0 0 18px color-mix(in srgb,var(--accent) 38%,transparent))}canvas{width:100%;height:100%;display:block}.pointer{position:absolute;z-index:2;top:0;left:50%;transform:translateX(-50%);width:28px;height:45px;background:linear-gradient(180deg,#f2d6ff,#a958ff);clip-path:polygon(0 0,100% 0,50% 100%);filter:drop-shadow(0 3px 5px #612da999)}.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:var(--surface);border:7px solid var(--hub);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent),0 3px 14px #0004;pointer-events:none}
.control{background:linear-gradient(165deg,var(--surface-2),color-mix(in srgb,var(--surface-2) 82%,var(--accent) 18%));border-left:1px solid var(--line);padding:31px 25px;display:flex;flex-direction:column;min-width:0}.control-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.control h2{font-size:19px;letter-spacing:-.045em;margin:0}.count{font-size:11px;color:var(--muted);font-weight:750;background:var(--surface);border:1px solid var(--line);padding:6px 10px;border-radius:99px}.entry-list{display:flex;flex-wrap:wrap;gap:8px;max-height:205px;overflow:auto;align-content:flex-start;margin-bottom:15px}.chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 10px 9px 12px;font-size:13px;font-weight:650;max-width:100%;box-shadow:0 2px 8px #4d30700a}.chip span,.chip .entry-link{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chip .entry-link{max-width:180px;color:var(--accent);text-decoration:underline;text-underline-offset:2px}.chip button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:17px;line-height:1;padding:0}.chip button:hover{color:#ff668b}.add{display:flex;gap:8px}.add input{width:100%;min-width:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:12px 13px;font:inherit;font-size:13px;outline:none}.add input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}.add button{flex:none;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);padding:0 15px;font:inherit;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 5px 14px color-mix(in srgb,var(--accent) 30%,transparent)}.palette-control{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;font-size:12px;font-weight:700}.palette-control label{color:var(--ink)}.palette-control select{max-width:58%;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:9px 30px 9px 11px;font:inherit;font-size:12px;outline:none;cursor:pointer}.palette-control select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}.speed-control{margin-top:21px}.speed-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;font-weight:700}.speed-head label{color:var(--ink)}.speed-head strong{color:var(--accent);font-size:12px}.speed-control input{width:100%;height:5px;margin:0;accent-color:var(--accent);cursor:pointer}.speed-scale{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:5px}.spin{border:0;border-radius:14px;background:linear-gradient(110deg,#8051df,#b45be6);color:#fff;padding:16px;margin-top:17px;font:inherit;font-size:15px;font-weight:850;letter-spacing:-.02em;cursor:pointer;box-shadow:0 8px 22px #8c4bd13d;transition:transform .15s,filter .15s,box-shadow .15s}.spin:hover{transform:translateY(-2px);filter:saturate(1.15) brightness(1.06);box-shadow:0 11px 28px #8c4bd14d}.spin:disabled{opacity:.48;cursor:not-allowed;transform:none;box-shadow:none}.hint{color:var(--muted);font-size:11px;text-align:center;margin:10px 0 0}.result{display:none;margin-top:20px;background:color-mix(in srgb,var(--surface) 85%,var(--accent) 15%);border:1px solid color-mix(in srgb,var(--line) 55%,var(--accent) 45%);border-radius:15px;padding:15px 16px}.result.show{display:block;animation:appear .3s ease}.result small{display:block;text-transform:uppercase;letter-spacing:.13em;font-size:10px;color:var(--accent);font-weight:850;margin-bottom:5px}.result strong{font-size:22px;letter-spacing:-.04em}@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
footer{grid-column:1/-1;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:15px 30px;color:var(--muted);font-size:11px;background:color-mix(in srgb,var(--surface) 82%,transparent)}.reset{border:0;background:none;color:var(--muted);font:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer}.reset:hover{color:var(--ink)}.winner-flash{position:fixed;z-index:50;left:50%;top:50%;width:max-content;min-width:min(310px,calc(100vw - 32px));max-width:calc(100vw - 32px);padding:21px 28px;border:1px solid color-mix(in srgb,var(--accent) 60%,white);border-radius:22px;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(24px) saturate(150%);box-shadow:0 24px 80px #0005,0 0 40px color-mix(in srgb,var(--accent) 35%,transparent);text-align:center;pointer-events:none;opacity:0;visibility:hidden;transform:translate(-50%,-44%) scale(.94);transition:opacity .18s ease,transform .18s ease,visibility .18s}.winner-flash.show{opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}.winner-flash small{display:block;color:var(--accent);font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.18em;margin-bottom:7px}.winner-flash strong{display:block;color:var(--ink);font-size:clamp(24px,5vw,42px);letter-spacing:-.05em;line-height:1.05;overflow-wrap:anywhere}.winner-dismiss-hint{display:block;margin-top:13px;color:var(--muted);font-size:11px}.winner-flash strong a,.result strong a{color:inherit;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}@media(max-width:820px){body{padding:12px}.app{min-height:calc(100vh - 24px);grid-template-columns:1fr;grid-template-rows:auto auto auto auto;border-radius:23px}header{padding:16px 18px}.mode-label{display:none}.stage{padding:27px 22px 10px}.wheel-zone{min-height:0;padding:23px 20px 16px}.wheel-wrap{width:min(83vw,410px)}.control{border-left:0;border-top:1px solid var(--line);padding:22px}.entry-list{max-height:150px}footer{padding:13px 18px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}</style></head>
<body class="dark"><main class="app"><header><div class="brand"><span class="logo">↗</span><span>крутится</span></div><div class="top-right"><span class="mode-label">Настройка</span><button class="theme-toggle" id="themeToggle" type="button" aria-pressed="true"><span id="themeIcon">☾</span><span id="themeText">Тёмная</span><span class="toggle-track"></span></button></div></header>
<section class="stage"><p class="kicker">Колесо фортуны</p><h1>"Пусть выберет<br>колесо."</h1><p class="lede">Добавь варианты.</p><div class="wheel-zone"><div class="wheel-wrap"><div class="pointer"></div><canvas id="wheel" width="900" height="900" aria-label="Колесо фортуны"></canvas><div class="hub"></div></div></div></section>
<aside class="control"><div class="control-head"><h2>Варианты</h2><span class="count" id="count">0</span></div><div class="entry-list" id="entries"></div><form class="add" id="addForm"><input id="newEntry" maxlength="36" placeholder="Добавить свой вариант…" aria-label="Новый вариант"><button type="submit">＋</button></form><div class="palette-control"><label for="paletteSelect">Цвет колеса</label><select id="paletteSelect" aria-label="Выбрать цвет"><option value="neutral">Нейтральные</option><option value="violet" selected>Фиолетовые</option><option value="ocean">Океан</option><option value="warm">Тёплые</option></select></div><div class="speed-control"><div class="speed-head"><label for="speed">Время вращения</label><strong id="speedValue">5 сек</strong></div><input id="speed" type="range" min="2" max="15" step="1" value="5" aria-label="Время вращения в секундах"><div class="speed-scale"><span>2 сек</span><span>15 сек</span></div></div><button class="spin" id="spin">Крутить колесо <span>↗</span></button><p class="hint">Для честного выбора добавьте от 2 вариантов</p><div class="result" id="result"><small>Колесо выбрало</small><strong id="winner"></strong></div></aside>
<footer><span>Случайность ✳</span></footer></main><div class="winner-flash" id="winnerFlash" role="status" aria-live="polite"><small>Выпало</small><strong id="flashWinner"></strong><span class="winner-dismiss-hint">Нажми, чтобы закрыть</span></div>
<script>
const speedInput=document.querySelector('#speed');speedInput.addEventListener('input',()=>document.querySelector('#speedValue').textContent=speedInput.value+' сек');const palettes={neutral:['#56535a','#706d73','#5f5e63','#77747b','#514f55','#69666c','#5b5960','#767278','#625e66','#535158'],violet:['#8054e8','#a65ce5','#7649c6','#c26ce9','#6842ac','#9156d6','#743ab0','#b16be1','#8350c5','#a65ac7'],ocean:['#285b70','#347a89','#275d62','#3d8692','#284a63','#327287','#246366','#44818a','#31556d','#367b78'],warm:['#75533f','#936044','#704247','#a16a48','#7d5447','#8d493d','#705d4a','#985740','#6e484b','#936f4b']};const paletteSelect=document.querySelector('#paletteSelect');let activePalette=palettes.violet;paletteSelect.addEventListener('change',()=>{activePalette=palettes[paletteSelect.value];draw()});let options=['Да','Нет'],angle=0,spinning=false;const canvas=document.querySelector('#wheel'),ctx=canvas.getContext('2d'),root=document.documentElement;
function draw(){const n=options.length,c=450,r=424;ctx.clearRect(0,0,900,900);if(!n){ctx.beginPath();ctx.arc(c,c,r,0,Math.PI*2);ctx.fillStyle=root.dataset.theme==='dark'?'#303a33':'#e8e4da';ctx.fill();ctx.fillStyle=root.dataset.theme==='dark'?'#a3ada5':'#78827b';ctx.font='600 32px system-ui';ctx.textAlign='center';ctx.fillText('Добавьте варианты',c,c+10);return}const step=2*Math.PI/n;options.forEach((item,i)=>{const start=angle+i*step-Math.PI/2,end=start+step;ctx.beginPath();ctx.moveTo(c,c);ctx.arc(c,c,r,start,end);ctx.closePath();ctx.fillStyle=activePalette[i%activePalette.length];ctx.fill();ctx.strokeStyle=root.dataset.theme==='dark'?'#1a211d':'#fffefa';ctx.lineWidth=8;ctx.stroke();ctx.save();ctx.translate(c,c);ctx.rotate(start+step/2);ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.shadowColor='#0002';ctx.shadowBlur=2;const font=Math.max(19,Math.min(31,390/n));ctx.font=`750 ${font}px system-ui`;ctx.fillText(item.length>20?item.slice(0,19)+'…':item,r-30,0);ctx.restore()});ctx.beginPath();ctx.arc(c,c,r,0,Math.PI*2);ctx.strokeStyle=root.dataset.theme==='dark'?'#1a211d':'#fffefa';ctx.lineWidth=10;ctx.stroke()}
function linkUrl(value){let candidate=value.trim();if(!/^https?:\/\//i.test(candidate)){if(/^(?:www\.)?[a-z0-9](?:[a-z0-9.-]*[a-z0-9])?\.[a-z]{2,}(?::\d+)?(?:[/?#]\S*)?$/i.test(candidate))candidate='https://'+candidate;else return null}try{const url=new URL(candidate);return url.protocol==='http:'||url.protocol==='https:'?url.href:null}catch{return null}}
function setLinkedValue(target,value){target.replaceChildren();const url=linkUrl(value);if(!url){target.textContent=value;return}const link=document.createElement('a');link.href=url;link.target='_blank';link.rel='noopener noreferrer';link.textContent=value;link.setAttribute('aria-label','Открыть ссылку в новой вкладке');target.append(link)}function announceWinner(value){const flash=document.querySelector('#winnerFlash');setLinkedValue(document.querySelector('#flashWinner'),value);flash.classList.add('show');document.addEventListener('click',dismissWinnerFlash)}
function dismissWinnerFlash(){document.querySelector('#winnerFlash').classList.remove('show');document.removeEventListener('click',dismissWinnerFlash)}
function render(){const box=document.querySelector('#entries');box.replaceChildren();options.forEach((v,i)=>{const el=document.createElement('span');el.className='chip';const href=linkUrl(v);let label;if(href){label=document.createElement('a');label.className='entry-link';label.href=href;label.target='_blank';label.rel='noopener noreferrer';label.setAttribute('aria-label','Открыть ссылку в новой вкладке')}else{label=document.createElement('span')}label.textContent=v;const b=document.createElement('button');b.type='button';b.setAttribute('aria-label','Удалить '+v);b.textContent='×';b.onclick=()=>{options.splice(i,1);render()};b.disabled=spinning;el.append(label,b);box.append(el)});document.querySelector('#count').textContent=options.length+' / 24';document.querySelector('#spin').disabled=options.length<2||spinning;document.querySelector('#newEntry').disabled=spinning;document.querySelector('#addForm button').disabled=spinning;draw()}
document.querySelector('#addForm').addEventListener('submit',e=>{e.preventDefault();const input=document.querySelector('#newEntry'),v=input.value.trim();if(v&&options.length<24){options.push(v);input.value='';document.querySelector('#result').classList.remove('show');render();input.focus()}});
document.querySelector('#spin').onclick=()=>{if(spinning||options.length<2)return;spinning=true;document.querySelector('#result').classList.remove('show');document.querySelector('#winnerFlash').classList.remove('show');document.removeEventListener('click',dismissWinnerFlash);render();const winnerIndex=Math.floor(Math.random()*options.length),step=2*Math.PI/options.length,target=-(winnerIndex+Math.random())*step,normalized=((target-angle)%(2*Math.PI)+2*Math.PI)%(2*Math.PI),destination=angle+2*Math.PI*(6+Math.floor(Math.random()*4))+normalized,start=angle,duration=Number(speedInput.value)*1000,t0=performance.now();function frame(now){const p=Math.min((now-t0)/duration,1),ease=1-Math.pow(1-p,4);angle=start+(destination-start)*ease;draw();if(p<1)requestAnimationFrame(frame);else{angle=destination%(2*Math.PI);const pointerOffset=(((-angle)%(2*Math.PI))+2*Math.PI)%(2*Math.PI),landedIndex=Math.min(options.length-1,Math.floor(pointerOffset/step)),landedValue=options[landedIndex];spinning=false;setLinkedValue(document.querySelector('#winner'),landedValue);document.querySelector('#result').classList.add('show');announceWinner(landedValue);render()}}requestAnimationFrame(frame)};
 
document.querySelector('#themeToggle').onclick=()=>{const dark=root.dataset.theme!=='dark';root.dataset.theme=dark?'dark':'light';document.body.classList.toggle('dark',dark);document.querySelector('#themeToggle').setAttribute('aria-pressed',String(dark));document.querySelector('#themeIcon').textContent=dark?'☾':'☀';document.querySelector('#themeText').textContent=dark?'Тёмная':'Светлая';document.querySelector('meta[name="theme-color"]').content=dark?'#000000':'#eee9f8';draw()};
render();
</script></body></html>
